# pages.yml — deploys the static report demo on main only; never on PRs.
name: pages

on:
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

        # The report renders the committed fixture scan, which must be
        # regenerated before the export so it matches the current rules.
      - name: Install and regenerate the fixture scan
        run: npm ci && npm run scan:fixtures

      - name: Build static demo (basePath rescue-scanner)
        run: python scripts/build_demo.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
