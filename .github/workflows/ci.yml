# ci.yml — Rescue Scanner. npm deps live at the repo ROOT (scanner/ + frontend/
# + shared/ share one lockfile); there is no backend/. Keep actions on version
# tags (pin to SHAs before public release — P2 checklist item).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: npm ci

      - name: Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify (typecheck, lint, unit, build, demo export, e2e)
        run: python scripts/verify.py --ci --e2e
